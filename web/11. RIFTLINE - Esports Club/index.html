U.admin=()=>{const en=cfg.lang==='en',sections=cfg.admin;let key=U.path[1]||'overview',sec=sections.find(x=>x.key===key);const side=`<aside class="admin-side">${U.eyebrow(en?'WORKSPACE':'УПРАВЛЕНИЕ')}<a href="#/admin" class="${!sec?'active':''}">${U.icon('grid')}${en?'Overview':'Обзор'}</a>${sections.map(s=>`<a href="#/admin/${s.key}" class="${key===s.key?'active':''}">${U.icon(s.icon||'file')}${s.label}</a>`).join('')}<a href="#/home">${U.icon('arrow')}${en?'View website':'На сайт'}</a></aside>`;

function home(){let m=upcoming(),p=active('products')[0];return `<main class="screen-enter">${scene(`<div class="wrap hero-grid"><div class="hero-visual" data-depth="3"><div class="float-loop" style="height:100%">${img('team','Основной состав RIFTLINE','drift',true)}</div></div><div class="hero-copy"><span class="eyebrow"><i class="dot"></i> COUNTER-STRIKE 2 / СЕЗОН 2026</span><h1>ВЫШЕ<span>ИГРЫ.</span></h1><p>Пять характеров. Одна команда.<br>Каждый раунд — наша общая история.</p>${link('roster','Знакомься с командой '+icon('arrow'),'btn')}</div><span class="hero-coordinate">RFT / 55° 45′ N / PLAY AS ONE</span><div class="hero-stamp">НАША СТОРОНА<strong>R/01</strong>ПО ТУ СТОРОНУ ОБЫЧНОГО</div></div><div class="hero-bottom"><div class="wrap"><span class="row"><i class="dot" style="color:var(--accent)"></i> RIFTLINE ESPORTS CLUB</span><a href="#next-match" class="scroll-hint">ЛИСТАЙ ДАЛЬШЕ ${icon('right')}</a><span>01 — 05 / MAIN ROSTER</span></div></div>`,'rift-hero')}${scene(`<div class="marquee"><div class="marquee-track" aria-hidden="true">${Array(8).fill('<span>PLAY AS ONE <b>✳</b> RIFTLINE ESPORTS <b>↗</b></span>').join('')}</div></div>`,'')}<div class="wrap section" id="next-match" style="padding-bottom:0">${m?`<div class="match-strip reveal-target"><div>${eyebrow('СЛЕДУЮЩИЙ МАТЧ')}<strong>${h(m.date.slice(8))}.${h(m.date.slice(5,7))} <span class="muted">/ ${h(m.time)}</span></strong></div><div>${eyebrow('ТУРНИР')}<span style="font-size:12px">${h(m.event)}</span></div><div class="match-teams">${mark()}<strong>RFT</strong><span class="vs">VS</span><span class="enemy-mark">${h(m.enemy.slice(0,1))}</span><strong>${h(m.enemy)}</strong></div>${btn(icon('arrow'),'match','outline small',`data-id="${m.id}" aria-label="Подробнее о следующем матче"`)}</div>`:U.empty('Скоро новые матчи','Следи за расписанием команды.','matches','К расписанию')}</div>${scene(`<div class="wrap section"><div class="section-head"><div>${eyebrow('01 / ТЕ, КТО В ИГРЕ')}<h2>У КАЖДОГО СВОЯ РОЛЬ.</h2></div>${link('roster','Весь состав '+icon('arrow'),'text-link')}</div><div class="roster-grid">${active('players').filter(p=>p.group==='players').slice(0,5).map(playerCard).join('')}</div></div>`)}${scene(`<div class="wrap section" style="padding-top:15px"><div class="section-head"><div>${eyebrow('02 / ЖИЗНЬ КЛУБА')}<h2>ПО ТУ СТОРОНУ СЕРВЕРА.</h2></div>${link('news','Все материалы '+icon('arrow'),'text-link')}</div><div class="news-grid">${active('news').slice(0,2).map(newsCard).join('')}</div></div>`)}${p?scene(`<div class="wrap"><div class="merch-banner"><div class="merch-copy">${eyebrow('03 / WEAR YOUR SIDE')}<h2>ТВОЙ ЦВЕТ.<br>ТВОЯ КОМАНДА.</h2><p>Джерси, которая объединяет. На трибуне, за компьютером и за его пределами.</p>${link('merch/'+p.id,'Посмотреть джерси '+icon('arrow'),'btn')}</div><a href="#/merch/${p.id}" class="merch-picture" aria-label="${h(p.name)}"><div class="float-loop" style="height:100%">${img(p.image,p.name)}</div><span class="edition">RIFT / 01 — TEAM EDITION</span></a></div></div>`):''}${scene(`<div class="wrap club-statement">${eyebrow('PLAY AS ONE')}<h2>Победа начинается<br>с тех, кто <em>рядом.</em></h2>${link('about','Больше о клубе '+icon('arrow'),'text-link')}</div>`)}</main>`}
function roster(){let players=active('players').filter(p=>p.group===rosterTab);return `<main class="screen-enter">${pageTop('СОСТАВ','ПЯТЬ ГОЛОСОВ.<br>ОДНО РЕШЕНИЕ.','Индивидуальный стиль. Общее направление. Знакомься с людьми, которые выходят на сервер под знаком RIFTLINE.')}<div class="wrap section" style="padding-top:15px"><div class="tabs roster-tabs"><button class="tab ${rosterTab==='players'?'active':''}" data-act="roster-tab" data-tab="players">Основной состав</button><button class="tab ${rosterTab==='staff'?'active':''}" data-act="roster-tab" data-tab="staff">Тренерский штаб</button></div><div class="roster-grid">${players.map(playerCard).join('')}</div></div></main>`}
function player(){let p=U.state.players.find(v=>v.id===U.path[1]&&v.status==='active');if(!p)return notFound();return `<main class="screen-enter">${pageTop('СОСТАВ',h(p.name),h(p.role))}<div class="wrap account-grid"><div class="player-modal-photo" style="--portrait:${Number(p.portrait)||0}">${img(p.portrait==='-1'?'arena':'team',p.name)}</div><div class="prose" style="padding:0"><span class="eyebrow">${h(p.realName)}</span><h2>В команде — ${h(p.name)}.</h2><p>${h(p.description)}</p><p>Дисциплина: Counter-Strike 2. Основная роль: ${h(p.role.toLowerCase())}.</p>${link('roster','Вернуться к составу '+icon('arrow'),'text-link')}</div></div></main>`}
function matches(){let items=U.state.matches.filter(m=>m.status===matchTab).sort((a,b)=>matchTab==='upcoming'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));return `<main class="screen-enter">${pageTop('МАТЧИ','КАЖДЫЙ РАУНД<br>ИМЕЕТ ЗНАЧЕНИЕ.','Ближайшие встречи и результаты. Выбери матч, чтобы открыть подробности или сохранить его в календарь.')}<div class="wrap section" style="padding-top:20px"><div class="tabs" style="margin-bottom:30px">${[['upcoming','Ближайшие'],['completed','Результаты']].map(([k,t])=>`<button class="tab ${matchTab===k?'active':''}" data-act="match-tab" data-tab="${k}">${t}</button>`).join('')}</div><div class="match-list">${items.map(m=>`<div class="match-row reveal-target"><div class="date">${h(m.date.split('-').reverse().join('.'))}<small>${h(m.time)} · ${h(m.format)}</small></div><div class="match-teams">${mark()}<span>RIFTLINE</span><span class="vs">vs</span><span>${h(m.enemy)}</span></div><div class="event">${h(m.event)}</div><button class="${m.status==='completed'?'score win':'icon-btn'}" style="background:none" data-act="match" data-id="${m.id}" aria-label="Открыть матч ${h(m.name)}">${m.status==='completed'?h(m.score):icon('arrow')}</button></div>`).join('')||U.empty('Пока нет матчей','Следующие встречи появятся здесь.')}</div></div></main>`}
function showMatch(id){let m=U.state.matches.find(v=>v.id===id);if(!m)return;U.modal('Матч / '+m.format,`<span class="eyebrow muted">${h(m.event)}</span><div class="match-detail-teams"><span>RIFTLINE</span><span class="vs">${m.status==='completed'?h(m.score):'VS'}</span><span>${h(m.enemy)}</span></div><p>${h(m.date.split('-').reverse().join('.'))} · ${h(m.time)} (Минск, UTC+3)</p><p>${m.status==='completed'?'Встреча завершена. Итоговый счёт серии указан выше.':'Серия до двух побед. Состав карт определяется перед началом встречи.'}</p>${m.status==='upcoming'?btn(icon('calendar')+'Добавить в календарь','reminder','',`data-id="${m.id}"`):link('news','Жизнь команды '+icon('arrow'),'btn outline')}`)}
function merch(){let products=active('products'),p=products.find(p=>p.id===U.path[1])||products[0];if(!p)return `<main>${pageTop('МЕРЧ','НОВАЯ КОЛЛЕКЦИЯ<br>УЖЕ В ПУТИ.')}<div class="wrap section">${U.empty('Скоро в магазине','Готовим следующие вещи команды.')}</div></main>`;return `<main class="screen-enter"><div class="wrap page-top" style="padding-bottom:0"><div class="breadcrumbs">${link('home','RIFTLINE')}<span>/</span><span>Мерч</span></div></div><div class="wrap rift-shop"><div class="product-main" data-depth="3"><button data-act="jersey-zoom" data-id="${p.id}" style="background:none;padding:0;width:100%" aria-label="Увеличить изображение">${img(p.image,p.name,'float-loop',true)}</button></div><div>${eyebrow('RIFT / 01 — TEAM EDITION')}<h1>${h(p.name)}</h1><p>${h(p.description)}</p><div class="price">${U.money(p.price)}</div><div class="jersey-spec"><span>Свободная посадка</span><span>100% полиэстер</span></div><div class="sizes">${eyebrow('РАЗМЕР')}<div class="size-buttons">${['S','M','L','XL','XXL'].map(v=>`<button class="${size===v?'selected':''}" aria-pressed="${size===v}" data-act="size" data-size="${v}">${v}</button>`).join('')}</div></div>${btn(p.stock>0?'В корзину '+icon('bag'):'Нет в наличии','add-cart','',`data-id="${p.id}" ${p.stock>0?'':'disabled'}`)}<p style="font-size:10px;margin-top:15px">${p.stock>0?'В наличии · '+p.stock+' шт.':'Ждём пополнение'}</p><div class="product-notes"><details><summary>Материалы и уход ${icon('plus')}</summary><p>Технический полиэстер с фактурным плетением. Стирка при 30 °C с изнаночной стороны. Сушить естественным способом.</p></details><details><summary>Размерная сетка ${icon('plus')}</summary><p>S — обхват груди 92–98 см<br>M — 98–104 см<br>L — 104–110 см<br>XL — 110–116 см<br>XXL — 116–122 см</p></details><details><summary>Как оформить заказ ${icon('plus')}</summary><p>Добавь джерси в корзину и оставь контактные данные. Заказ появится в твоём кабинете. Оплата на сайте не производится.</p></details></div></div></div>${products.length>1?`<div class="wrap section"><h2>Ещё в коллекции</h2><div class="news-grid" style="margin-top:30px">${products.filter(v=>v.id!==p.id).map(v=>`<a href="#/merch/${v.id}">${img(v.image,v.name)}<h3>${h(v.name)}</h3><p>${U.money(v.price)}</p></a>`).join('')}</div></div>`:''}</main>`}
function cart(){let items=U.state.cart;U.modal('Твоя корзина',items.length?`${items.map((v,i)=>`<div class="cart-item">${img(v.image,v.name)}<div><h3>${h(v.name)}</h3><p>Размер ${h(v.size)} · ${U.money(v.price)}</p><div class="quantity"><button data-act="qty" data-index="${i}" data-step="-1" aria-label="Уменьшить количество">−</button><span>${v.qty}</span><button data-act="qty" data-index="${i}" data-step="1" aria-label="Увеличить количество">+</button></div></div><div><strong style="font-size:12px">${U.money(v.price*v.qty)}</strong><br><button class="remove" data-act="remove" data-index="${i}">Удалить</button></div></div>`).join('')}<div class="cart-summary"><div class="row between total"><span>Итого</span><span>${U.money(total())}</span></div>${btn('Оформить заказ '+icon('right'),'checkout')}<p style="font-size:11px">Оплата на сайте не производится.</p></div>`:U.empty('Корзина пока пуста','Выбери свою командную форму.','merch','К мерчу'),'drawer')}
function total(){return U.state.cart.reduce((n,v)=>n+v.price*v.qty,0)}
function checkout(){U.modal('Оформление заказа',`<form class="form-grid" data-form="checkout">${field('name','Имя',U.state.profile.name,'text','required autocomplete="name"')}${field('email','Email',U.state.profile.email,'email','required autocomplete="email"')}${field('phone','Телефон','','tel','required autocomplete="tel"')}${field('city','Город','','text','required autocomplete="address-level2"')}<div class="full">${area('address','Адрес и комментарий','','required maxlength="1000"')}</div><div class="full row between"><span>Итого</span><strong>${U.money(total())}</strong></div><label class="check-field full"><input type="checkbox" required>Согласен на сохранение данных для оформления заказа.</label><button class="btn full" type="submit">Создать заказ ${icon('arrow')}</button></form>`)}
function news(){let n=active('news').find(v=>v.id===U.path[1]);if(U.path[1]&&!n)return notFound();return n?`<main class="screen-enter"><article class="rift-article">${pageTop(h(n.category),h(n.title),h(n.description))}${img(n.image,n.title,'',true)}<div class="prose">${n.body.split('\n\n').map(p=>`<p>${h(p)}</p>`).join('')}${link('news','Все материалы '+icon('arrow'),'text-link')}</div></article></main>`:`<main>${pageTop('НОВОСТИ','ПО ТУ СТОРОНУ<br>СЕРВЕРА.','Люди, подготовка и моменты между раундами.')}<div class="wrap section" style="padding-top:20px"><div class="news-grid">${active('news').map(newsCard).join('')}</div></div></main>`}
function account(){return `<main>${pageTop('КАБИНЕТ','ТЫ НА НАШЕЙ<br>СТОРОНЕ.','Твои заказы, матчи в календаре и данные болельщика.')}<div class="wrap account-grid"><form class="account-panel stack" data-form="profile"><h2>Твой профиль</h2>${field('name','Имя',U.state.profile.name,'text','required')}${field('email','Email',U.state.profile.email,'email','required')}<button class="btn small" type="submit">Сохранить</button></form><div class="stack"><div><h2 style="font-size:30px;margin-bottom:25px">Мои заказы</h2><div class="account-list">${U.state.orders.map(o=>`<div class="account-record"><div class="row between"><h3>${h(o.name)}</h3><span class="pill">${statusText(o.status)}</span></div><p style="font-size:12px;margin-bottom:15px">${h(o.items?.map(v=>v.name+' / '+v.size+' × '+v.qty).join(', ')||'Заказ магазина')}</p><div class="row between"><span>${h(o.date)}</span><strong>${U.money(o.total)}</strong></div></div>`).join('')||U.empty('Заказов пока нет','Командная джерси ждёт в магазине.','merch','Выбрать мерч')}</div></div><div><h2 style="font-size:28px;margin:20px 0">Мой календарь</h2>${U.state.reminders.map(id=>U.state.matches.find(m=>m.id===id)).filter(Boolean).map(m=>`<div class="account-record"><div class="row between"><div><h3>${h(m.name)}</h3><p style="font-size:12px">${h(m.date)} · ${h(m.time)}</p></div>${btn(icon('calendar'),'reminder','outline small',`data-id="${m.id}" aria-label="Скачать событие календаря"`)}</div></div>`).join('')||`<p>Сохрани ближайший матч, чтобы он появился здесь.</p>`}</div></div></div></main>`}
function statusText(v){return({new:'Новый',processing:'В работе',sent:'Отправлен',completed:'Завершён',cancelled:'Отменён'})[v]||v}
function contact(){return `<main>${pageTop('СОТРУДНИЧЕСТВО','ДАВАЙ СЫГРАЕМ<br>В ОДНОЙ КОМАНДЕ.','Партнёрство, контент или совместный проект — расскажи о своей идее.')}<div class="wrap account-grid"><div><h2 style="font-size:30px">Есть что обсудить.</h2><p style="margin-top:20px;font-size:13px">Выбери тему и оставь сообщение. Оно появится в разделе заявок клуба.</p></div><form class="form-grid" data-form="contact">${field('name','Твоё имя','','text','required')}${field('email','Email','','email','required')}${select('topic','Тема','Партнёрство',['Партнёрство','Медиа и контент','Карьера в клубе','Другой вопрос'])}${field('company','Компания / проект')}${area('message','Расскажи подробнее','','required maxlength="3000"')}<button type="submit" class="btn full">Сохранить заявку ${icon('arrow')}</button></form></div></main>`}
function about(){return `<main>${pageTop('О КЛУБЕ','ИГРАЕМ ВМЕСТЕ.<br>РАСТЁМ ВМЕСТЕ.','RIFTLINE — команда, в которой сильный индивидуальный стиль становится общим языком.')}<div class="wrap">${img('arena','За кулисами соревновательной арены','rift-about-img',true)}<div class="prose"><h2>Важен каждый голос.</h2><p>Наша идея проста: доверие между игроками важнее громких обещаний. Мы разбираем ошибки, задаём неудобные вопросы и возвращаемся к работе.</p><p>Болельщики — часть этой истории. Здесь можно познакомиться с составом, следить за встречами и выбрать командную форму.</p>${link('roster','Познакомиться с составом '+icon('arrow'),'btn')}</div></div></main>`}
function notFound(){return `<main class="wrap section">${U.empty('Страница не найдена','Возможно, запись была удалена или ещё не опубликована.','home','На главную')}</main>`}
U.action('roster-tab',el=>{rosterTab=el.dataset.tab;U.refresh()});U.action('match-tab',el=>{matchTab=el.dataset.tab;U.refresh()});U.action('match',el=>showMatch(el.dataset.id));U.action('size',el=>{size=el.dataset.size;U.refresh()});U.action('cart',cart);U.action('checkout',checkout);
U.action('jersey-zoom',el=>{let p=U.state.products.find(v=>v.id===el.dataset.id);if(p)U.modal(p.name,img(p.image,p.name),'lightbox')});
U.action('add-cart',el=>{let p=U.state.products.find(v=>v.id===el.dataset.id),count=U.state.cart.filter(v=>v.productId===p.id).reduce((n,v)=>n+v.qty,0);if(count>=p.stock){U.toast('Больше нет в наличии');return}let found=U.state.cart.find(v=>v.productId===p.id&&v.size===size);if(found)found.qty++;else U.state.cart.push({productId:p.id,name:p.name,price:p.price,image:p.image,size,qty:1});U.save();U.refresh();U.toast('Джерси добавлена в корзину')});
U.action('qty',el=>{let v=U.state.cart[Number(el.dataset.index)];if(!v)return;let p=U.state.products.find(p=>p.id===v.productId),all=U.state.cart.filter(i=>i.productId===v.productId).reduce((n,i)=>n+i.qty,0);if(Number(el.dataset.step)>0&&(!p||all>=p.stock)){U.toast('Больше нет в наличии');return}v.qty+=Number(el.dataset.step);if(v.qty<=0)U.state.cart.splice(Number(el.dataset.index),1);U.save();U.refresh();cart()});
U.action('remove',el=>{U.state.cart.splice(Number(el.dataset.index),1);U.save();U.refresh();cart()});
U.form('checkout',data=>{if(!U.state.cart.length)return;for(let item of U.state.cart){let p=U.state.products.find(v=>v.id===item.productId&&v.status==='active'),qty=U.state.cart.filter(v=>v.productId===item.productId).reduce((n,v)=>n+v.qty,0);if(!p||p.stock<qty){U.toast('Часть товаров недоступна. Обнови корзину.');return}}let num='RFT-'+String(Date.now()).slice(-6),o={id:U.id('order'),name:num,customer:String(data.get('name')),email:String(data.get('email')),phone:String(data.get('phone')),address:String(data.get('city'))+', '+String(data.get('address')),items:structuredClone(U.state.cart),total:total(),date:U.today(),status:'new'};U.state.orders.unshift(o);for(let item of U.state.cart)U.state.products.find(p=>p.id===item.productId).stock-=item.qty;U.state.profile={name:o.customer,email:o.email};U.state.cart=[];U.log('Создан заказ '+num);U.refresh();U.modal('Заказ создан',U.success(num,'Заказ сохранён. Его состав и статус доступны в кабинете болельщика. Оплата не производилась.','account','Открыть кабинет'))});
U.form('profile',data=>{U.state.profile=Object.fromEntries(data);U.save();U.toast('Профиль сохранён')});U.form('newsletter',(data,form)=>{let email=String(data.get('email'));if(!U.state.subscribers.includes(email))U.state.subscribers.push(email);U.save();form.reset();U.toast('Адрес сохранён в списке подписчиков')});

U.action('reminder',el=>{let m=U.state.matches.find(v=>v.id===el.dataset.id);if(!m)return;let date=m.date.replaceAll('-',''),hours=Number(m.time.slice(0,2))-3,start=date+'T'+String(hours).padStart(2,'0')+m.time.slice(3)+'00Z';let end=new Date(Date.UTC(...[Number(m.date.slice(0,4)),Number(m.date.slice(5,7))-1,Number(m.date.slice(8)),hours+3,Number(m.time.slice(3))])).toISOString().replace(/[-:]/g,'').replace('.000','');U.download('riftline-'+m.id+'.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//RIFTLINE//Match Calendar//EN','BEGIN:VEVENT','UID:'+m.id+'@riftline.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace('.000',''),'DTSTART:'+start,'DTEND:'+end,'SUMMARY:RIFTLINE vs '+m.enemy,'DESCRIPTION:'+m.event,'END:VEVENT','END:VCALENDAR'].join('\r\n'),'text/calendar');if(!U.state.reminders.includes(m.id))U.state.reminders.push(m.id);U.save();U.toast('Файл календаря сохранён')});
