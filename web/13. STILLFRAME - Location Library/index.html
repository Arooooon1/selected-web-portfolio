U.refresh=(scroll=false)=>{U.path=decodeURIComponent(location.hash.slice(2)||'home').split('/');if(observer)observer.disconnect();document.querySelector('#app').innerHTML=cfg.render();document.querySelector('main')?.setAttribute('id','main-content');if(scroll)window.scrollTo(0,0);U.motion();document.title=(U.path[0]==='home'?'':(cfg.titles?.[U.path[0]]||cfg.brand)+' — ')+cfg.title;};
U.motion=()=>{let reduced=document.documentElement.classList.contains('no-motion')||matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelectorAll('main h1,main h2,main .section-head,main .reveal-target').forEach((el,i)=>{el.classList.add('reveal');el.style.setProperty('--delay',(i%3)*65+'ms')});observer=new IntersectionObserver(entries=>entries.forEach(e=>{e.target.classList.toggle('in-view',e.isIntersecting);if(e.isIntersecting)e.target.classList.add('seen')}),{threshold:.08,rootMargin:'20px'});document.querySelectorAll('.reveal,.scene,.drift').forEach(el=>{if(reduced)el.classList.add('seen');observer.observe(el)});};

U.admin=()=>{const en=cfg.lang==='en',sections=cfg.admin;let key=U.path[1]||'overview',sec=sections.find(x=>x.key===key);const side=`<aside class="admin-side">${U.eyebrow(en?'WORKSPACE':'УПРАВЛЕНИЕ')}<a href="#/admin" class="${!sec?'active':''}">${U.icon('grid')}${en?'Overview':'Обзор'}</a>${sections.map(s=>`<a href="#/admin/${s.key}" class="${key===s.key?'active':''}">${U.icon(s.icon||'file')}${s.label}</a>`).join('')}<a href="#/home">${U.icon('arrow')}${en?'View website':'На сайт'}</a></aside>`;
let body='';if(!sec){body=`<div class="admin-title"><div><span class="eyebrow">${cfg.brand} / ${en?'CONTROL ROOM':'ПАНЕЛЬ УПРАВЛЕНИЯ'}</span><h1 style="margin-top:18px">${en?'A clear overview.':'Всё под контролем.'}</h1><p>${en?'Content, requests and the details that matter.':'Контент, заявки и важные детали — в одном месте.'}</p></div>${U.btn(U.icon('download')+(en?'Export':'Экспорт'),'admin-export','outline small')}</div><div class="admin-metrics">${sections.slice(0,3).map(s=>`<div class="metric">${U.eyebrow(s.label)}<strong>${U.state[s.key].length}</strong><small>${en?'records in your workspace':'записей в пространстве'}</small></div>`).join('')}</div><div class="admin-grid"><div class="admin-panel"><h2>${en?'Your workspace':'Структура проекта'}</h2><div class="admin-distribution">${sections.map(s=>{let count=U.state[s.key].length,max=Math.max(...sections.map(v=>U.state[v.key].length),1);return `<a href="#/admin/${s.key}"><div class="bar-label"><span>${s.label}</span><span>${count} ${U.icon('right')}</span></div><div class="bar-track"><div class="bar-fill" style="width:${count/max*100}%"></div></div></a>`}).join('')}</div></div><div class="admin-panel"><h2>${en?'Recent activity':'Последние изменения'}</h2><div class="admin-activity">${U.state.activity.slice(0,5).map(v=>`<div><p>${U.h(v.text)}</p><small>${U.h(v.date)}</small></div>`).join('')||`<p class="muted">${en?'New changes will appear here.':'Новые изменения появятся здесь.'}</p>`}</div></div></div>`;}else{let query=U.adminQuery||'',items=U.state[sec.key].filter(v=>JSON.stringify(v).toLowerCase().includes(query.toLowerCase()));body=`<div class="admin-title"><div>${U.eyebrow(cfg.brand+' / '+(en?'CONTENT':'КОНТЕНТ'))}<h1 style="margin-top:18px">${sec.label}</h1><p>${U.state[sec.key].length} ${en?'records':'записей'}</p></div>${U.btn(U.icon('plus')+(en?'Add new':'Добавить'),'admin-add','small',`data-key="${sec.key}"`)}</div><div class="toolbar"><form class="search-form" data-form="admin-search"><input name="query" type="search" aria-label="${en?'Search records':'Поиск записей'}" placeholder="${en?'Search records…':'Найти запись…'}" value="${U.h(query)}"><button class="icon-btn" aria-label="${en?'Search':'Найти'}">${U.icon('search')}</button></form>${U.btn(U.icon('download')+'CSV','admin-export','outline small',`data-key="${sec.key}"`)}</div><div class="table-wrap"><table><thead><tr><th>${en?'Name / Details':'Название / Детали'}</th><th>${sec.valueLabel||(en?'Details':'Информация')}</th><th>${en?'Status':'Статус'}</th><th>${en?'Actions':'Действия'}</th></tr></thead><tbody>${items.map(v=>`<tr><td><strong>${U.h(v.name||v.title||v.nickname||v.customer||v.id)}</strong><small>${U.h(v.email||v.category||v.game||v.city||v.date||'')}</small></td><td>${U.h(sec.value?sec.value(v):v.description?.slice(0,55)||'—')}</td><td>${sec.statuses?`<select class="status-select" data-admin-status="${sec.key}" data-id="${v.id}" aria-label="${en?'Status for':'Статус:'} ${U.h(v.name||v.title||v.id)}">${sec.statuses.map(([k,l])=>`<option value="${k}" ${v.status===k?'selected':''}>${l}</option>`).join('')}</select>`:'—'}</td><td><div class="table-actions"><button class="icon-btn" data-act="admin-edit" data-key="${sec.key}" data-id="${v.id}" aria-label="${en?'Edit':'Редактировать'} ${U.h(v.name||v.title||v.id)}">${U.icon('edit')}</button><button class="icon-btn" data-act="admin-delete" data-key="${sec.key}" data-id="${v.id}" aria-label="${en?'Delete':'Удалить'} ${U.h(v.name||v.title||v.id)}">${U.icon('trash')}</button></div></td></tr>`).join('')||`<tr><td colspan="4">${en?'No matching records.':'Записи не найдены.'}</td></tr>`}</tbody></table></div>`;}return `<main class="admin-layout screen-enter">${side}<div class="admin-main">${body}<p class="admin-notice">${en?'Changes are saved in this browser and reflected on the website.':'Изменения сохраняются в этом браузере и отражаются на сайте.'}</p><button class="text-link" style="background:none;color:var(--muted);font-size:10px" data-act="admin-reset">$ function adminEdit(key,id){let s=cfg.admin.find(v=>v.key===key),item=id?U.state[key].find(v=>v.id===id):{};if(!s||!item)return;U.editing={key,id};let fields=s.fields.map(f=>{let value=item[f.name]??f.default??'';if(f.type==='select')return U.select(f.name,f.label,value,f.options,'required');if(f.type==='textarea')return U.area(f.name,f.label,value,f.required?'required':'');return U.field(f.name,f.label,value,f.type||'text',`${f.required?'required':''} ${f.type==='number'?'min="0" step="1"':'maxlength="500"'}`)}).join('');U.modal((id?(cfg.lang==='en'?'Edit record':'Редактировать запись'):(cfg.lang==='en'?'Add record':'Новая запись')),`<form class="form-grid" data-form="admin-editor">${fields}<div class="full">${U.btn(cfg.lang==='en'?'Save changes':'Сохранить','unused','', 'type="submit"').replace('type="button"','type="submit"').replace(' data-act="unused"','')}</div></form>`);}

U.action('admin-confirm-delete',()=>{let {key,id}=U.deleting;U.state[key]=U.state[key].filter(v=>v.id!==id);U.log((cfg.lang==='en'?'Deleted record from ':'Удалена запись: ')+cfg.admin.find(v=>v.key===key).label);U.close();U.refresh();U.toast(cfg.lang==='en'?'Record deleted':'Запись удалена')});
U.form('admin-editor',data=>{let {key,id}=U.editing,s=cfg.admin.find(v=>v.key===key);let values=Object.fromEntries(data);s.fields.filter(f=>f.type==='number').forEach(f=>values[f.name]=Number(values[f.name]));if(id){let i=U.state[key].findIndex(v=>v.id===id);U.state[key][i]={...U.state[key][i],...values}}else U.state[key].unshift({id:U.id(key),...values});U.log((cfg.lang==='en'?'Updated ':'Обновлено: ')+s.label);U.close();U.refresh();U.toast(cfg.lang==='en'?'Changes saved':'Изменения сохранены')});

function dateAfter(date,offset){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+offset);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function range(date,days){return Array.from({length:Number(days)},(_,i)=>dateAfter(date,i))}
function blocked(p){let out=p.blocked.split(',').map(v=>v.trim()).filter(Boolean);for(let r of U.state.requests.filter(v=>v.locationId===p.id&&['pending','approved'].includes(v.status)))out.push(...range(r.date,Number(r.days)||1));return new Set(out)}
function available(p,date,days=1){return /^\d{4}-\d{2}-\d{2}$/.test(date)&&dateAfter(date,0)===date&&date>=U.today()&&!range(date,days).some(d=>blocked(p).has(d))}

function card(p){let saved=U.state.shortlist.includes(p.id);return `<article class="location-card reveal-target"><div class="location-photo"><a href="#/location/${p.id}">${img(p.image,p.name+' — '+p.area)}</a><button class="shortlist-btn ${saved?'saved':''}" data-act="save-location" data-id="${p.id}" aria-label="${saved?'Remove from':'Add to'} shortlist: ${h(p.name)}" aria-pressed="${saved}">${icon('heart')}</button><span class="location-tag">${h(p.tag||types[p.category])}</span></div><div class="location-card-info"><div class="row between"><h3>${link('location/'+p.id,h(p.name))}</h3><span class="location-rate">${U.money(p.rate)} <span class="muted">/ day</span></span></div><p>${icon('pin')}${h(p.area)}<span>·</span>${p.capacity} crew</p><p class="card-description">${h(p.description)}</p></div></article>`}
function home(){return `<main class="screen-enter">${scene(`<div class="still-hero-photo" data-depth="3"><div class="float-loop">${img('loft','Morning light through three arched windows in a spacious industrial loft','drift',true)}</div></div><div class="wrap still-hero-inner"><div class="still-hero-copy">${eyebrow('<i class="dot"></i> DISTINCTIVE PLACES. UNWRITTEN STORIES.')}<h1>A place for<br>your <em>next story.</em></h1><p>Extraordinary spaces for films, photographs<br>and the ideas that need somewhere to begin.</p>${link('locations','Find your location '+icon('arrow'),'text-link')}</div><a href="#/location/arched-loft" class="hero-location">${icon('pin')}<span>IN THE FRAME<strong>THE ARCHED LOFT</strong>London / SF—001</span></a><div class="hero-counter"><span>01</span><span class="counter-line"></span><span>03</span></div><div class="location-search"><form data-form="hero-search"><label><span>The setting</span><select name="category" aria-label="Type of location"><option value="all">Any kind of space</option>${Object.entries(types).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label><label><span>The area</span><select name="region" aria-label="Area"><option value="all">Anywhere in our collection</option><option>London</option><option>East Sussex</option></select></label><label><span>The date</span><input name="date" type="text" placeholder="YYYY-MM-DD" inputmode="numeric" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" aria-label="Shoot date"></label><button type="submit" class="btn">Find a space ${icon('arrow')}</button></form><div class="hero-caption"><span>GOOD LOCATIONS DO MORE THAN LOOK GOOD. THEY MOVE THE STORY.</span><span>SCROLL TO EXPLORE ↓</span></div></div></div>`,'still-hero')}${scene(`<div class="wrap still-intro">${eyebrow('CURATED FOR THE FRAME')}<h2>Some spaces have a story<br>before you even <em>press record.</em></h2></div>`)}${scene(`<div class="wrap section"><div class="section-head"><div>${eyebrow('THE CURRENT COLLECTION')}<h2>Worth a closer look.</h2></div>${link('locations','Explore every space '+icon('arrow'),'text-link')}</div><div class="location-grid">${locations().slice(0,3).map(card).join('')}</div></div>`)}${scene(`<div class="still-editorial"><a href="#/location/tide-house" class="still-editorial-photo" data-depth="3">${img('coast','A secluded concrete house overlooking the East Sussex coastline','drift')}</a><div class="still-editorial-copy">${eyebrow('A DIFFERENT POINT OF VIEW')}<h2>Let the setting<br>do some of<br>the storytelling.</h2><p>Raw concrete. A changing sky. The quiet before a scene begins. Find places with a presence of their own.</p>${link('locations/house','Discover houses & retreats '+icon('arrow'),'btn')}</div></div>`)}${scene(`<div class="wrap section"><div class="section-head"><div>${eyebrow('LESS SEARCHING. MORE CREATING.')}<h2>From first look to first take.</h2></div>${link('how-it-works','The full process '+icon('arrow'),'text-link')}</div><div class="still-steps"><div class="still-step"><span>01</span><h3>Find your frame.</h3><p>Explore by setting, area and budget. Look closely at the details that will shape your shoot.</p></div><div class="still-step"><span>02</span><h3>Make it yours.</h3><p>Save a shortlist, add production notes and bring the right options together for your project.</p></div><div class="still-step"><span>03</span><h3>Start a conversation.</h3><p>Choose your dates and send a location enquiry. Keep the details together in your workspace.</p></div></div></div>`)}<div class="wrap still-owner"><div>${eyebrow('FOR SPACE OWNERS')}<h2>Your space could be<br>someone’s next scene.</h2><p>A remarkable home, studio or something unexpected?</p></div>${link('list-your-space','Tell us about your space '+icon('arrow'),'btn')}</div></main>`}
function locationList(){let cat=U.path[1]&&types[U.path[1]]?U.path[1]:type;let list=locations().filter(p=>(cat==='all'||p.category===cat)&&(region==='all'||p.city===region)&&(budget==='all'||p.rate<=Number(budget))&&(!shootDate||available(p,shootDate))&&(p.name+' '+p.description+' '+p.area).toLowerCase().includes(query.toLowerCase()));return `<main class="screen-enter">${top('THE COLLECTION',cat==='all'?'Find your next setting.':h(types[cat])+'.','Places with character, ready for your point of view.')}<div class="wrap section" style="padding-top:10px"><form class="location-filters" data-form="filter"><label>Setting<select name="category"><option value="all">All settings</option>${Object.entries(types).map(([k,v])=>`<option value="${k}" ${cat===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Area<select name="region">${[['all','All areas'],['London','London'],['East Sussex','East Sussex']].map(([k,v])=>`<option value="${k}" ${region===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Day rate<select name="budget">${[['all','Any budget'],['1000','Up to £1,000'],['1500','Up to £1,500'],['2000','Up to £2,000']].map(([k,v])=>`<option value="${k}" ${budget===k?'selected':''}>${v}</option>`).join('')}</select></label><label>Find a detail<input type="search" name="query" placeholder="Light, concrete, period…" value="${h(query)}"></label><button class="btn" type="submit">Apply ${icon('right')}</button></form><div class="toolbar"><span class="eyebrow muted" style="font-size:9px">${list.length} SPACES${shootDate?' · '+h(shootDate):''}</span><div class="row"><button class="text-link" style="font-size:10px;background:none;border-bottom:0" data-act="clear-filters">Clear filters</button><div class="view-switch"><button class="icon-btn ${view==='grid'?'active':''}" data-act="view" data-view="grid" aria-label="Grid view" aria-pressed="${view==='grid'}">${icon('grid')}</button><button class="icon-btn ${view==='list'?'active':''}" data-act="view" data-view="list" aria-label="List view" aria-pressed="${view==='list'}">${icon('menu')}</button></div></div></div>${list.length?`<div class="location-grid catalog-grid ${view==='list'?'list-view':''}">${list.map(card).join('')}</div>`:U.empty('No spaces in this frame.','Try a different setting, area or budget.','locations','Explore all locations')}</div></main>`}
function calendar(p){let first=new Date(calendarYear,calendarMonth,1),count=new Date(calendarYear,calendarMonth+1,0).getDate(),pad=(first.getDay()+6)%7,taken=blocked(p),days=[];for(let i=0;i<pad;i++)days.push('<span></span>');for(let n=1;n<=count;n++){let date=calendarYear+'-'+String(calendarMonth+1).padStart(2,'0')+'-'+String(n).padStart(2,'0'),disabled=date<U.today()||taken.has(date);days.push(`<button class="calendar-day ${disabled?'blocked':''} ${shootDate===date?'selected':''}" data-act="calendar-day" data-date="${date}" ${disabled?'disabled':''} aria-label="${date}${disabled?' unavailable':''}">${n}</button>`)}return `<div class="calendar-head"><h3>${first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h3><div class="row" style="gap:7px">${btn('←','calendar-month','outline small','data-step="-1" aria-label="Previous month"')}${btn('→','calendar-month','outline small','data-step="1" aria-label="Next month"')}</div></div><div class="calendar-grid">${['M','T','W','T','F','S','S'].map((v,i)=>`<span aria-label="${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]}">${v}</span>`).join('')}${days.join('')}</div><div class="calendar-legend"><span><i></i>Available</span><span><i class="taken"></i>Unavailable</span></div>`}

function locationPage(){let p=loc(U.path[1]);if(!p)return notFound();return `<main class="screen-enter"><div class="wrap"><div class="location-detail-top"><div><span class="eyebrow muted">${h(types[p.category])} / ${h(p.id.toUpperCase())}</span><h1>${h(p.name)}</h1><p>${icon('pin')}${h(p.area)}</p></div>${btn(icon('heart')+(U.state.shortlist.includes(p.id)?'Saved to shortlist':'Add to shortlist'),'save-location','outline small',`data-id="${p.id}"`)}</div><div class="location-detail-hero" data-depth="3"><button data-act="location-zoom" data-id="${p.id}" aria-label="View full location photograph">${img(p.image,p.name,'',true)}</button><span class="photo-count">${icon('plus')} View photograph</span></div><div class="location-detail-body"><div class="location-detail-copy"><div class="tabs">${[['overview','Overview'],['details','The details'],['availability','Availability']].map(([k,t])=>`<button class="tab ${detailTab===k?'active':''}" data-act="detail-tab" data-tab="${k}">${t}</button>`).join('')}</div>${detailTab==='overview'?`<h2>A space with a point of view.</h2><p>${h(p.description)}</p><div class="location-facts"><div><strong>${p.size} m²</strong><span>Usable space</span></div><div><strong>${p.capacity}</strong><span>Maximum crew</span></div><div><strong>10 hours</strong><span>Standard shoot day</span></div></div><h2 style="font-size:30px">What makes it work.</h2><div class="amenities">${p.amenities.split('|').filter(Boolean).map(v=>`<span>${icon('check')}${h(v.trim())}</span>`).join('')}</div>`:detailTab==='details'?`<h2>The practical side.</h2><p>A standard shoot day covers up to 10 hours, including setup and breakdown. The maximum on-site crew is ${p.capacity} people.</p><p>Location access and a detailed production plan are agreed before a confirmed booking. Please include equipment, parking needs and any planned changes to the space in your enquiry.</p><div class="location-facts"><div><strong>${p.size} m²</strong><span>Usable floor area</span></div><div><strong>${U.money(p.rate)}</strong><span>Base day rate</span></div><div><strong>£125</strong><span>Coordination</span></div></div><h2 style="font-size:30px">House guidelines.</h2><p>Protect floors and furniture. No smoking indoors. Discuss additional equipment, animals or set dressing before the shoot. Leave the location as you found it.</p>`:`<h2>Find a day that fits.</h2><p>Choose an available day to start your enquiry. Existing pending and approved requests are held in this local calendar.</p>${calendar(p)}`}</div>${booking(p)}</div></div></main>`}
function shortlist(){let list=U.state.shortlist.map(loc).filter(Boolean);return `<main class="screen-enter">${top('YOUR SHORTLIST','Good possibilities.<br>One place to keep them.','Bring your favourite spaces together and add the details that matter for your shoot.')}<div class="wrap section" style="padding-top:10px"><div class="shortlist-header"><div><h2>${h(U.state.projectName)}</h2><p>${list.length} ${list.length===1?'location':'locations'} saved for your next story.</p></div><div class="row">${btn('Rename project','rename-project','outline small')}${btn(icon('download')+'Export selection','export-shortlist','small')}</div></div>${list.length?list.map(p=>`<article class="shortlist-item"><a href="#/location/${p.id}">${img(p.image,p.name)}</a><div><div class="row between"><h3>${link('location/'+p.id,h(p.name))}</h3><button class="icon-btn" data-act="save-location" data-id="${p.id}" aria-label="Remove ${h(p.name)} from shortlist">${icon('close')}</button></div><p>${h(p.area)} · ${U.money(p.rate)} / day · ${p.capacity} crew</p><form data-form="save-note" data-id="${p.id}">${area('note','Production notes',U.state.notes[p.id]||'','maxlength="2000" placeholder="Light, mood, ideas for a scene…"')}<div class="row between" style="margin-top:15px"><button class="btn outline small" type="submit">Save note</button>${link('location/'+p.id,'Explore this space '+icon('arrow'),'text-link')}</div></form></div></article>`).join(''):U.empty('Your next setting is out there.','Tap the heart on a location to start your project shortlist.','locations','Explore the collection')}</div></main>`}
function workspace(){return `<main>${top('YOUR WORKSPACE','Keep the story moving.','Your enquiries, project shortlist and production details.')}<div class="wrap section" style="padding-top:0"><div class="tabs workspace-tabs">${[['requests','Location enquiries'],['profile','Your details']].map(([k,t])=>`<button class="tab ${workspaceTab===k?'active':''}" data-act="workspace-tab" data-tab="${k}">${t}</button>`).join('')}${link('shortlist','Project shortlist '+icon('arrow'),'tab')}</div>${workspaceTab==='profile'?`<form class="form-grid account-panel" style="max-width:700px" data-form="profile">${field('name','Your name',U.state.profile.name,'text','required')}${field('email','Email',U.state.profile.email,'email','required')}${field('company','Production company',U.state.profile.company)}<button class="btn full" type="submit">Save your details ${icon('check')}</button></form>`:U.state.requests.length?U.state.requests.map(r=>`<article class="workspace-request"><div class="row between"><h3>${h(r.locationName||r.name)}</h3><span class="pill">${requestLabels[r.status]||h(r.status)}</span></div><p>${h(r.project||r.name)} · ${h(r.date)} · ${r.days||1} shoot days · ${r.crew||0} crew</p><div class="row between"><span>Reference ${h(r.reference||r.id)} · ${U.money(r.total)}</span>${['pending','approved'].includes(r.status)?btn('Cancel enquiry','cancel-enquiry','outline small',`data-id="${r.id}"`):''}</div></article>`).join(''):U.empty('Every story starts somewhere.','Choose a location and send your first enquiry.','locations','Find your setting')}</div></main>`}
function how(){return `<main>${top('HOW IT WORKS','Less searching.<br>More creating.','A clear route from a promising space to the details of your next production.')}<div class="wrap"><div class="how-intro">${img('apartment','Warm afternoon light in an art deco apartment','',true)}<div><h2>Start with the feeling.<br>Then check the details.</h2><p>Explore the collection by setting, area and budget. Save the spaces that fit your project, compare practical details and add notes to your shortlist.</p><p>When a location feels right, choose dates and crew size. The estimate shows the day rate and coordination fee before you save an enquiry.</p>${link('locations','Explore locations '+icon('arrow'),'btn')}</div></div><div class="still-faq" style="padding-bottom:80px">${[['How do dates work?','The calendar reflects pending and approved enquiries in this browser. Overlapping requests are prevented. This is a portfolio demonstration; it does not reserve a real property.'],['What is included in a shoot day?','The estimate covers a 10-hour day, including setup and breakdown, plus a fixed £125 location coordination fee per enquiry.'],['Can I bring a large crew?','Each location has a stated crew limit. The enquiry form checks this limit. Include any additional production requirements in your message.'],['When do I pay?','No payments are collected on this website. Enquiries are saved locally for demonstration and can be reviewed in your workspace.'],['Can I share a shortlist?','Use Export selection to download your project name, chosen locations and production notes as a text file.']].map(([q,a])=>`<details><summary>${q}${icon('plus')}</summary><p>${a}</p></details>`).join('')}</div></div></main>`}
function about(){return `<main>${top('OUR APPROACH','Good spaces.<br>Better possibilities.','We look for places with presence — and the practical details that help a production come together.')}<div class="wrap"><div class="still-photo-block">${img('loft','A characterful industrial loft in warm daylight','drift',true)}</div><div class="prose"><h2 style="font-family:var(--serif);font-size:48px">The setting is part of the story.</h2><p>Light, texture and scale change the way a scene feels. A weathered wall can hold more atmosphere than a room full of props. A window can decide the shape of a whole day.</p><p>STILLFRAME brings distinctive spaces into a clear, considered collection. Look closely, build a shortlist and find a place that leaves room for your own point of view.</p>${link('locations','Find your frame '+icon('arrow'),'btn')}</div></div></main>`}
function owner(contact=false){return `<main>${top(contact?'GET IN TOUCH':'FOR SPACE OWNERS',contact?'Let’s talk about<br>your next project.':'Your space.<br>A new perspective.',contact?'Tell us what you have in mind, and keep your request with the project details.':'A remarkable home, studio or setting deserves to be seen. Tell us what makes yours different.')}<div class="wrap owner-form-layout"><div>${eyebrow(contact?'PRODUCTION QUESTIONS':'WHAT WE LOOK FOR')}<h2>${contact?'The details make<br>the difference.':'Character.<br>Light. Possibility.'}</h2><p>${contact?'Share your dates, crew and the kind of setting you need. A clear brief helps turn an idea into a workable plan.':'We welcome distinctive interiors, architecture and landscapes. Include the location, approximate size and a short description of the space.'}</p>${img(contact?'apartment':'coast',contact?'An intimate art deco location':'Coastal architectural setting')}</div><form class="form-grid" data-form="owner-request" data-kind="${contact?'production':'space'}">${field('name','Your name','','text','required')}${field('email','Email','','email','required')}${field('company',contact?'Project / company':'Name of your space','','text','required')}${field('area',contact?'Preferred area':'Town / area','','text','required')}${select('category',contact?'Type of enquiry':'Type of space',contact?'Production':'loft',contact?['Production','Location advice','Other']:Object.entries(types))}${field('size',contact?'Approximate crew size':'Approximate size, m²','','number','min="1" required')}${area('message',contact?'Tell us about the project':'What makes your space special?','','required maxlength="3000"')}<label class="check-field full"><input type="checkbox" required>I agree to save these details for this enquiry.</label><button class="btn full" type="submit">Save enquiry ${icon('arrow')}</button></form></div></main>`}
function notFound(){return `<main class="wrap section">${U.empty('Outside the frame.','This location may no longer be published. Explore the rest of the collection.','locations','Back to the collection')}</main>`}
U.action('save-location',el=>{let id=el.dataset.id,i=U.state.shortlist.indexOf(id);if(i<0)U.state.shortlist.push(id);else U.state.shortlist.splice(i,1);U.save();U.refresh();U.toast(i<0?'Location added to your shortlist':'Location removed from your shortlist')});
U.action('view',el=>{view=el.dataset.view;U.refresh()});U.action('detail-tab',el=>{detailTab=el.dataset.tab;U.refresh()});U.action('workspace-tab',el=>{workspaceTab=el.dataset.tab;U.refresh()});U.action('clear-filters',()=>{type=region=budget='all';shootDate=query='';U.route('locations')});
U.form('hero-search',data=>{type=String(data.get('category'));region=String(data.get('region'));shootDate=String(data.get('date'));query='';U.route('locations')});U.form('filter',data=>{type=String(data.get('category'));region=String(data.get('region'));budget=String(data.get('budget'));query=String(data.get('query'));if(U.path[1])U.route('locations');else U.refresh()});
U.action('location-zoom',el=>{let p=loc(el.dataset.id);if(p)U.modal(p.name,img(p.image,p.name),'lightbox')});
U.action('calendar-month',el=>{let d=new Date(calendarYear,calendarMonth+Number(el.dataset.step),1);calendarMonth=d.getMonth();calendarYear=d.getFullYear();U.refresh()});U.action('calendar-day',el=>{shootDate=el.dataset.date;U.refresh();U.toast('Shoot date selected: '+shootDate)});
U.form('prepare-enquiry',(data,form)=>{let p=loc(form.dataset.id);shootDate=String(data.get('date'));shootDays=Number(data.get('days'));shootCrew=Number(data.get('crew'));if(!available(p,shootDate,shootDays)){U.toast('Those dates are unavailable. Please choose another day.');return}if(shootCrew<1||shootCrew>p.capacity){U.toast('This location supports up to '+p.capacity+' crew.');return}U.pending={locationId:p.id,date:shootDate,days:shootDays,crew:shootCrew,total:p.rate*shootDays+125};U.modal('Your location enquiry',`<p><strong>${h(p.name)}</strong><br>${h(shootDate)} · ${shootDays} ${shootDays===1?'day':'days'} · ${shootCrew} crew · ${U.money(U.pending.total)}</p><form class="form-grid" data-form="confirm-enquiry">${field('name','Your name',U.state.profile.name,'text','required autocomplete="name"')}${field('email','Email',U.state.profile.email,'email','required autocomplete="email"')}${field('project','Project name',U.state.projectName==='Untitled project'?'':U.state.projectName,'text','required')}${select('production','Production type','Film',['Film','Photography','Commercial','Music video','Other'])}${area('message','Anything we should know?','','required maxlength="3000"')}<label class="check-field full"><input type="checkbox" required>I agree to save these details with my enquiry.</label><button class="btn full" type="submit">Save location enquiry ${icon('arrow')}</button><p class="full" style="font-size:10px">No payment is collected. This saves a request in your local workspace.</p></form>`)});
U.form('confirm-enquiry',data=>{let p=loc(U.pending.locationId);if(!p||!available(p,U.pending.date,U.pending.days)){U.toast('Those dates have just become unavailable. Please choose again.');return}let values=Object.fromEntries(data),reference='SF-'+String(Date.now()).slice(-6);U.state.requests.unshift({id:U.id('enquiry'),...U.pending,...values,name:values.project,locationName:p.name,reference,status:'pending'});U.state.profile={name:values.name,email:values.email,company:U.state.profile.company};U.state.projectName=values.project;U.log('New location enquiry: '+p.name);U.refresh();U.modal('A promising start.',U.success(reference,'Your enquiry has been saved. Review its dates, estimate and status in your workspace.','workspace','Open your workspace'))});
U.action('cancel-enquiry',el=>{U.cancelId=el.dataset.id;U.modal('Cancel this enquiry?',`<p>Your dates will become available again. The enquiry will stay in your workspace with a cancelled status.</p>${btn('Cancel enquiry','confirm-cancel','outline')}`)});U.action('confirm-cancel',()=>{let r=U.state.requests.find(v=>v.id===U.cancelId);if(r){r.status='cancelled';U.log('Enquiry cancelled: '+(r.reference||r.id));U.close();U.refresh();U.toast('Enquiry cancelled')}});
U.action('rename-project',()=>U.modal('Name your project',`<form class="stack" data-form="rename-project">${field('name','Project name',U.state.projectName,'text','required maxlength="120"')}<button class="btn" type="submit">Save project name</button></form>`));U.form('rename-project',data=>{U.state.projectName=String(data.get('name'));U.save();U.close();U.refresh()});U.form('save-note',(data,form)=>{U.state.notes[form.dataset.id]=String(data.get('note'));U.save();U.toast('Production note saved')});
U.action('export-shortlist',()=>{let list=U.state.shortlist.map(loc).filter(Boolean);if(!list.length){U.toast('Add a location to your shortlist first.');return}let text=U.state.projectName+'\nSTILLFRAME / LOCATION SHORTLIST\n\n'+list.map(p=>[p.name,p.area,U.money(p.rate)+' / shoot day',p.capacity+' crew · '+p.size+' m²',p.description,'Production notes: '+(U.state.notes[p.id]||'—')].join('\n')).join('\n\n---\n\n');U.download('stillframe-shortlist.txt',text);U.toast('Shortlist exported')});
U.form('profile',data=>{U.state.profile=Object.fromEntries(data);U.save();U.toast('Your details have been saved')});U.form('newsletter',(data,form)=>{let email=String(data.get('email'));if(!U.state.subscribers.includes(email))U.state.subscribers.push(email);U.save();form.reset();U.toast('Email saved to the location updates list')});
U.form('owner-request',(data,form)=>{let values=Object.fromEntries(data);U.state.submissions.unshift({id:U.id('submission'),...values,kind:form.dataset.kind,status:'new',date:U.today()});U.log('New '+form.dataset.kind+' enquiry: '+values.company);U.modal('Details saved.',U.success('A new possibility.','Your enquiry is now in the studio dashboard. No information has been sent to an external service.','home','Back to STILLFRAME'))});
document.addEventListener('change',e=>{if(e.target.id==='booking-date')shootDate=e.target.value;if(e.target.id==='booking-crew')shootCrew=Number(e.target.value);if(e.target.id==='booking-days'){shootDays=Number(e.target.value);let p=loc(U.path[1]);if(p){document.querySelector('#quote-rate-label').textContent=U.money(p.rate)+' × '+shootDays+' '+(shootDays===1?'day':'days');document.querySelector('#quote-subtotal').textContent=U.money(p.rate*shootDays);document.querySelector('#quote-total').textContent=U.money(p.rate*shootDays+125)}}});
U.action('privacy',()=>U.modal('Privacy & local data','<p>Your shortlist, production notes, profile and enquiries are stored in this browser. They are not sent to an external server.</p><p>To remove them, clear site data in your browser settings or use Restore initial content in the studio dashboard.</p>'));
const requestLabels={pending:'Pending review',approved:'Approved',declined:'Declined',cancelled:'Cancelled'},pub=[['active','Published'],['draft','Draft']],requestStates=Object.entries(requestLabels);
U.start({brand:'STILLFRAME',key:'stillframe-portfolio-v1',lang:'en',currency:'GBP',title:'STILLFRAME — A place for your next story',titles:{locations:'The collection',location:'Location',shortlist:'Your shortlist',workspace:'Your workspace',admin:'Studio dashboard'},initial,render:()=>header()+(U.path[0]==='admin'?U.admin():({home,locations:locationList,location:locationPage,shortlist,workspace,'how-it-works':how,about,'list-your-space':()=>owner(false),contact:()=>owner(true)}[U.path[0]]||notFound)())+(U.path[0]==='admin'?'':footer()),admin:[
{key:'locations',label:'Locations',icon:'pin',value:v=>U.money(v.rate)+' / day',statuses:pub,fields:[{name:'name',label:'Location name',required:true},{name:'city',label:'Area',type:'select',options:['London','East Sussex']},{name:'area',label:'Neighbourhood / description',required:true},{name:'category',label:'Setting type',type:'select',options:Object.entries(types)},{name:'rate',label:'Day rate, GBP',type:'number',required:true},{name:'capacity',label:'Maximum crew',type:'number',required:true},{name:'size',label:'Usable area, m²',type:'number',required:true},{name:'image',label:'Photograph',type:'select',options:[['loft','Arched loft'],['coast','Coastal house'],['apartment','Art deco apartment']]},{name:'tag',label:'Image label'},{name:'amenities',label:'Features separated by |',required:true},{name:'blocked',label:'Blocked dates: YYYY-MM-DD, separated by commas'},{name:'description',label:'Description',type:'textarea',required:true},{name:'status',label:'Publication status',type:'select',options:pub}]},
{key:'requests',label:'Location enquiries',icon:'calendar',value:v=>v.date+' · '+U.money(v.total),statuses:requestStates,fields:[{name:'name',label:'Project name',required:true},{name:'project',label:'Production title',required:true},{name:'locationId',label:'Location',type:'select',options:()=>U.state.locations.map(p=>[p.id,p.name])},{name:'locationName',label:'Location display name',required:true},{name:'email',label:'Contact email',type:'email',required:true},{name:'date',label:'First shoot day',type:'date',required:true},{name:'days',label:'Shoot days',type:'number',required:true},{name:'crew',label:'Crew size',type:'number',required:true},{name:'total',label:'Estimate, GBP',type:'number',required:true},{name:'message',label:'Production notes',type:'textarea'},{name:'status',label:'Request status',type:'select',options:requestStates}]},
{key:'submissions',label:'Studio inbox',icon:'mail',value:v=>v.company,statuses:[['new','New'],['reviewing','Reviewing'],['completed','Completed']],fields:[{name:'name',label:'Contact name',required:true},{name:'email',label:'Email',type:'email',required:true},{name:'company',label:'Space / project name',required:true},{name:'area',label:'Area',required:true},{name:'message',label:'Message',type:'textarea',required:true},{name:'status',label:'Status',type:'select',options:[['new','New'],['reviewing','Reviewing'],['completed','Completed']]}]}
]});
})();


</script></body></html>
