U.admin=()=>{const en=cfg.lang==='en',sections=cfg.admin;let key=U.path[1]||'overview',sec=sections.find(x=>x.key===key);const side=`<aside class="admin-side">${U.eyebrow(en?'WORKSPACE':'УПРАВЛЕНИЕ')}<a href="#/admin" class="${!sec?'active':''}">${U.icon('grid')}${en?'Overview':'Обзор'}</a>${sections.map(s=>`<a href="#/admin/${s.key}" class="${key===s.key?'active':''}">${U.icon(s.icon||'file')}${s.label}</a>`).join('')}<a href="#/home">${U.icon('arrow')}${en?'View website':'На сайт'}</a></aside>`;
let body='';if(!sec){body=`<div class="admin-title"><div><span class="eyebrow">${cfg.brand} / ${en?'CONTROL ROOM':'ПАНЕЛЬ УПРАВЛЕНИЯ'}</span><h1 style="margin-top:18px">${en?'A clear overview.':'Всё под контролем.'}</h1><p>${en?'Content, requests and the details that matter.':'Контент, заявки и важные детали — в одном месте.'}</p></div>${U.btn(U.icon('download')+(en?'Export':'Экспорт'),'admin-export','outline small')}</div><div class="admin-metrics">${sections.slice(0,3).map(s=>`<div class="metric">${U.eyebrow(s.label)}<strong>${U.state[s.key].length}</strong><small>${en?'records in your workspace':'записей в пространстве'}</small></div>`).join('')}</div><div class="admin-grid"><div class="admin-panel"><h2>${en?'Your workspace':'Структура проекта'}</h2><div class="admin-distribution">${sections.map(s=>{let count=U.state[s.key].length,max=Math.max(...sections.map(v=>U.state[v.key].length),1);return `<a href="#/admin/${s.key}"><div class="bar-label"><span>${s.label}</span><span>${count} ${U.icon('right')}</span></div><div class="bar-track"><div class="bar-fill" style="width:${count/max*100}%"></div></div></a>`}).join('')}</div></div><div class="admin-panel"><h2>${en?'Recent activity':'Последние изменения'}</h2><div class="admin-activity">${U.state.activity.slice(0,5).map(v=>`<div><p>${U.h(v.text)}</p><small>${U.h(v.date)}</small></div>`).join('')||`<p class="muted">${en?'New changes will appear here.':'Новые изменения появятся здесь.'}</p>`}</div></div></div>`;}else{let query=U.adminQuery||'',items=U.state[sec.key].filter(v=>JSON.stringify(v).toLowerCase().includes(query.toLowerCase()));body=`<div class="admin-title"><div>${U.eyebrow(cfg.brand+' / '+(en?'CONTENT':'КОНТЕНТ'))}<h1 style="margin-top:18px">${sec.label}</h1><p>${U.state[sec.key].length} ${en?'records':'записей'}</p></div>${U.btn(U.icon('plus')+(en?'Add new':'Добавить'),'admin-add','small',`data-key="${sec.key}"`)}</div><div class="toolbar"><form class="search-form" data-form="admin-search"><input name="query" type="search" aria-label="${en?'Search records':'Поиск записей'}" placeholder="${en?'Search records…':'Найти запись…'}" value="${U.h(query)}"><button class="icon-btn" aria-label="${en?'Search':'Найти'}">${U.icon('search')}</button></form>${U.btn(U.icon('download')+'CSV','admin-export','outline small',`data-key="${sec.key}"`)}</div><div class="table-wrap"><table><thead><tr><th>${en?'Name / Details':'Название / Детали'}</th><th>${sec.valueLabel||(en?'Details':'Информация')}</th><th>${en?'Status':'Статус'}</th><th>${en?'Actions':'Действия'}</th></tr></thead><tbody>${items.map(v=>`<tr><td><strong>${U.h(v.name||v.title||v.nickname||v.customer||v.id)}</strong><small>${U.h(v.email||v.category||v.game||v.city||v.date||'')}</small></td><td>${U.h(sec.value?sec.value(v):v.description?.slice(0,55)||'—')}</td><td>${sec.statuses?`<select class="status-select" data-admin-status="${sec.key}" data-id="${v.id}" aria-label="${en?'Status for':'Статус:'} ${U.h(v.name||v.title||v.id)}">${sec.statuses.map(([k,l])=>`<option value="${k}" ${v.status===k?'selected':''}>${l}</option>`).join('')}</select>`:'—'}</td><td><div class="table-actions"><button class="icon-btn" data-act="admin-edit" data-key="${sec.key}" data-id="${v.id}" aria-label="${en?'Edit':'Редактировать'} ${U.h(v.name||v.title||v.id)}">${U.icon('edit')}</button><button class="icon-btn" data-act="admin-delete" data-key="${sec.key}" data-id="${v.id}" aria-label="${en?'Delete':'Удалить'} ${U.h(v.name||v.title||v.id)}">${U.icon('trash')}</button></div></td></tr>`).join('')||`<tr><td colspan="4">${en?'No matching records.':'Записи не найдены.'}</td></tr>`}</tbody></table></div>`;}return `<main class="admin-layout screen-enter">${side}<div class="admin-main">${body}<p class="admin-notice">${en?'Changes are saved in this browser and reflected on the website.':'Изменения сохраняются в этом браузере и отражаются на сайте.'}</p><button class="text-link" style="background:none;color:var(--muted);font-size:10px" data-act="admin-reset">${en?'Restore initial content':'Восстановить исходные данные'}</button></div></main>`;};
function adminEdit(key,id){let s=cfg.admin.find(v=>v.key===key),item=id?U.state[key].find(v=>v.id===id):{};if(!s||!item)return;U.editing={key,id};let fields=s.fields.map(f=>{let value=item[f.name]??f.default??'';if(f.type==='select')return U.select(f.name,f.label,value,f.options,'required');if(f.type==='textarea')return U.area(f.name,f.label,value,f.required?'required':'');return U.field(f.name,f.label,value,f.type||'text',`${f.required?'required':''} ${f.type==='number'?'min="0" step="1"':'maxlength="500"'}`)}).join('');U.modal((id?(cfg.lang==='en'?'Edit record':'Редактировать запись'):(cfg.lang==='en'?'Add record':'Новая запись')),`<form class="form-grid" data-form="admin-editor">${fields}<div class="full">${U.btn(cfg.lang==='en'?'Save changes':'Сохранить','unused','', 'type="submit"').replace('type="button"','type="submit"').replace(' data-act="unused"','')}</div></form>`);}
U.action('admin-add',el=>adminEdit(el.dataset.key));U.action('admin-edit',el=>adminEdit(el.dataset.key,el.dataset.id));
U.action('admin-delete',el=>{U.deleting={key:el.dataset.key,id:el.dataset.id};U.modal(cfg.lang==='en'?'Delete this record?':'Удалить запись?',`<p>${cfg.lang==='en'?'This record will be removed from the website. Existing order details will be kept.':'Запись будет удалена с сайта. Данные уже оформленных заказов сохранятся.'}</p>${U.btn(cfg.lang==='en'?'Delete record':'Удалить запись','admin-confirm-delete')}`)});
U.action('admin-confirm-delete',()=>{let {key,id}=U.deleting;U.state[key]=U.state[key].filter(v=>v.id!==id);U.log((cfg.lang==='en'?'Deleted record from ':'Удалена запись: ')+cfg.admin.find(v=>v.key===key).label);U.close();U.refresh();U.toast(cfg.lang==='en'?'Record deleted':'Запись удалена')});
U.form('admin-editor',data=>{let {key,id}=U.editing,s=cfg.admin.find(v=>v.key===key);let values=Object.fromEntries(data);s.fields.filter(f=>f.type==='number').forEach(f=>values[f.name]=Number(values[f.name]));if(id){let i=U.state[key].findIndex(v=>v.id===id);U.state[key][i]={...U.state[key][i],...values}}else U.state[key].unshift({id:U.id(key),...values});U.log((cfg.lang==='en'?'Updated ':'Обновлено: ')+s.label);U.close();U.refresh();U.toast(cfg.lang==='en'?'Changes saved':'Изменения сохранены')});
U.form('admin-search',data=>{U.adminQuery=String(data.get('query'));U.refresh()});
U.action('admin-export',el=>{let key=el.dataset.key;if(!key){U.download(cfg.brand.toLowerCase()+'-workspace.json',JSON.stringify(U.state,null,2),'application/json');return}let records=U.state[key],fields=cfg.admin.find(s=>s.key===key).fields.map(f=>f.name);const cell=v=>'"'+String(v??'').replace(/^([=+@-])/,'\t$1').replaceAll('"','""')+'"';U.download(cfg.brand.toLowerCase()+'-'+key+'.csv',[fields.map(cell).join(','),...records.map(v=>fields.map(f=>cell(v[f])).join(','))].join('\r\n'),'text/csv')});

{id:'study03',name:'Постер Study 03',category:'prints',price:3900,stock:20,image:'print',tag:'ЦВЕТ И ГЕОМЕТРИЯ',description:'Бордовый круг, жёлтая плоскость и спокойное светлое поле. Графическая композиция, которая добавляет комнате свой ритм.',material:'Плотная художественная бумага, рама из ореха',dimensions:'30 × 40 см / 50 × 70 см',variants:'30 × 40 см|50 × 70 см',status:'active'}],

function card(p){let liked=U.state.favorites.includes(p.id);return `<article class="object-card reveal-target"><div class="object-card-visual"><a href="#/product/${p.id}">${img(p.image,p.name)}</a><button class="favorite-btn ${liked?'selected':''}" data-act="favorite" data-id="${p.id}" aria-label="${liked?'Убрать из избранного':'Добавить в избранное'}: ${h(p.name)}" aria-pressed="${liked}">${icon('heart')}</button><span class="object-card-tag">${h(p.tag||cats[p.category]||'КОЛЛЕКЦИЯ')}</span></div><div class="object-card-info"><h3>${link('product/'+p.id,h(p.name))}</h3><span>${U.money(p.price)}</span></div><p>${h(cats[p.category]||p.category)} · ${p.stock>0?'В наличии':'Ожидается'}</p></article>`}
function home(){let post=U.state.posts.find(p=>p.status==='published');return `<main class="screen-enter">${scene(`<div class="object-hero-grid"><div class="object-hero-copy">${eyebrow('КОЛЛЕКЦИЯ 01 / ФОРМА И ТЕПЛО')}<h1>Вещи,<br>которые<br>остаются.</h1><p>Свет, керамика и искусство для дома.<br>Немного предметов. Много характера.</p>${link('catalog','Найти свой предмет '+icon('arrow'),'btn')}<span class="object-hero-index">01 / THE ART OF KEEPING</span></div><a class="object-hero-image" href="#/catalog" aria-label="Смотреть коллекцию"><div class="float-loop" data-depth="3">${img('editorial','Бордовый светильник, керамическая ваза и геометрический постер на светлом постаменте','drift',true)}</div><div class="object-image-label"><span>СТУДИЯ ПРЕДМЕТНОГО ДИЗАЙНА</span><span>ОСЕНЬ / 2026</span></div></a></div>`,'object-hero')}${scene('<div class="object-wordmark" aria-hidden="true">OBJECTORY</div>')}<div class="object-categories">${Object.entries(cats).map(([k,v],i)=>`<a href="#/catalog/${k}" class="category-link"><span>0${i+1}</span><strong>${v}</strong>${icon('arrow')}</a>`).join('')}</div>${scene(`<div class="wrap section"><div class="section-head object-section-head"><div>${eyebrow('ВЫБРАНО С ВНИМАНИЕМ')}<h2>Маленькая коллекция.<br>Большое присутствие.</h2></div>${link('catalog','Вся коллекция '+icon('arrow'),'text-link')}</div><div class="object-grid">${products().slice(0,3).map(card).join('')}</div></div>`)}${scene(`<div class="object-story"><div class="object-story-visual" data-depth="3">${img('vase','Фактурная керамическая ваза Loop','drift')}<span>LOOP / 02 — ТАКТИЛЬНАЯ КОЛЛЕКЦИЯ</span></div><div class="object-story-copy">${eyebrow('СНАЧАЛА — ОЩУЩЕНИЕ')}<h2>Дом начинается<br>с того, к чему<br>хочется прикоснуться.</h2><p>Тёплая керамика. Прохладный металл. Свет на бумаге. Мы собираем вещи, которые раскрываются в деталях и становятся частью повседневной жизни.</p>${link('about','Наш подход '+icon('arrow'),'text-link')}</div></div>`)}<div class="wrap"><div class="object-values"><div class="object-value"><span>01</span><div><h3>Форма со смыслом</h3><p>Выразительный силуэт и понятная функция. Предмет легко находит своё место.</p></div></div><div class="object-value"><span>02</span><div><h3>Материал в главной роли</h3><p>Фактура, вес, оттенок — детали, которые хочется рассмотреть поближе.</p></div></div><div class="object-value"><span>03</span><div><h3>Свобода сочетаний</h3><p>Объекты живут по отдельности и складываются в собственную историю.</p></div></div></div></div>${post?scene(`<div class="wrap section"><div class="object-journal"><a href="#/journal/${post.id}" class="media-frame">${img(post.image,post.title)}</a><div>${eyebrow('ЖУРНАЛ / '+h(post.category))}<h3>${h(post.title)}</h3><p>${h(post.description)}</p>${link('journal/'+post.id,'Читать заметку '+icon('arrow'),'text-link')}</div></div></div>`):''}${scene(`<div class="wrap object-statement">${eyebrow('МЕНЬШЕ СЛУЧАЙНОГО')}<p>Пусть рядом будут вещи,<br>которые что-то значат.</p></div>`)}</main>`}
function catalog(favorites=false){category=U.path[1]&&cats[U.path[1]]?U.path[1]:'all';let list=products().filter(p=>(favorites?U.state.favorites.includes(p.id):true)&&(category==='all'||p.category===category)&&(p.name+' '+p.description).toLowerCase().includes(query.toLowerCase()));if(sort==='asc')list.sort((a,b)=>a.price-b.price);if(sort==='desc')list.sort((a,b)=>b.price-a.price);if(sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name));return `<main class="screen-enter">${top(favorites?'ИЗБРАННОЕ':'КОЛЛЕКЦИЯ',favorites?'Твои находки.':category==='all'?'Предметы с характером.':h(cats[category]),favorites?'Сохраняй то, к чему хочется вернуться.':'Выбирай по настроению, материалу или просто по любви с первого взгляда.')}<div class="wrap section" style="padding-top:15px"><div class="toolbar catalog-toolbar"><div class="tabs">${[['all','Все предметы'],...Object.entries(cats)].map(([k,t])=>`<a class="tab ${category===k?'active':''}" href="#/${favorites?'favorites':'catalog'}${k==='all'?'':'/'+k}">${t}</a>`).join('')}</div><select id="catalog-sort" aria-label="Сортировка">${[['curated','Выбор OBJECTORY'],['asc','Цена: по возрастанию'],['desc','Цена: по убыванию'],['name','По названию']].map(([v,t])=>`<option value="${v}" ${sort===v?'selected':''}>${t}</option>`).join('')}</select><form class="catalog-search" data-form="search"><input type="search" name="query" placeholder="Найти предмет" value="${h(query)}" aria-label="Поиск по каталогу"><button aria-label="Найти">${icon('search')}</button></form><span class="eyebrow muted" style="font-size:9px">${list.length} ПРЕДМЕТА</span></div>${list.length?`<div class="object-grid">${list.map(card).join('')}</div>`:U.empty(favorites?'Здесь будут твои находки':'Ничего не найдено',favorites?'Нажми на сердечко в карточке понравившегося предмета.':'Попробуй другую категорию или измени запрос.','catalog','Смотреть коллекцию')}</div></main>`}
function productPage(){let p=product(U.path[1]);if(!p)return notFound();let options=variants(p);if(!options.includes(variant))variant=options[0];return `<main class="screen-enter"><div class="wrap page-top" style="padding-bottom:15px"><div class="breadcrumbs">${link('catalog','Коллекция')}<span>/</span>${link('catalog/'+p.category,h(cats[p.category]))}<span>/</span><span>${h(p.name)}</span></div></div><div class="wrap object-product"><div class="object-product-gallery" data-depth="3"><button data-act="zoom" data-id="${p.id}" aria-label="Увеличить изображение">${img(gallery===1?'editorial':p.image,gallery===1?'Предметы коллекции в композиции':p.name,'',true)}</button><span class="zoom-hint">${icon('plus')}</span><div class="gallery-thumbs"><button class="${gallery===0?'active':''}" data-act="gallery" data-index="0" aria-label="Предмет крупным планом">${img(p.image,p.name)}</button><button class="${gallery===1?'active':''}" data-act="gallery" data-index="1" aria-label="Предметы в композиции">${img('editorial','Предметная композиция')}</button></div></div><div class="object-product-info">${eyebrow(h(cats[p.category])+' / OBJECTORY 01')}<h1>${h(p.name)}</h1><p class="description">${h(p.description)}</p><div class="object-price">${U.money(price(p,variant))}</div>${select('variant','Исполнение',variant,options,'id="product-variant"')}<div class="object-buy-row">${btn(p.stock>0?'Добавить в корзину '+icon('right'):'Нет в наличии','add-cart','',`data-id="${p.id}" ${p.stock>0?'':'disabled'}`)}<button class="icon-btn" data-act="favorite" data-id="${p.id}" aria-label="${U.state.favorites.includes(p.id)?'Убрать из избранного':'Добавить в избранное'}" aria-pressed="${U.state.favorites.includes(p.id)}" style="${U.state.favorites.includes(p.id)?'color:var(--accent)':''}">${icon('heart')}</button></div><span class="stock-note"><i class="dot"></i>${p.stock>0?'В наличии · '+p.stock+' шт.':'Ожидаем пополнение'}</span><div class="object-product-details"><details open><summary>Материалы и размеры ${icon('plus')}</summary><p>${h(p.material)}.<br>${h(p.dimensions)}.</p></details><details><summary>Уход за предметом ${icon('plus')}</summary><p>${p.category==='ceramics'?'Протирать мягкой влажной тканью. Беречь от ударов и резких перепадов температуры.':p.category==='lighting'?'Отключить от сети перед очисткой. Протирать сухой мягкой тканью, избегая абразивных средств.':'Избегать прямого солнечного света и высокой влажности. Раму очищать сухой мягкой тканью.'}</p></details><details><summary>Доставка и оформление ${icon('plus')}</summary><p>Выбери доставку или самовывоз при оформлении. Заказ сохранится в личном кабинете. Оплата на сайте не производится.</p>${link('delivery','Подробнее '+icon('arrow'),'text-link')}</details></div></div></div>${scene(`<div class="wrap section" style="padding-top:30px"><div class="section-head object-section-head"><div>${eyebrow('ДИАЛОГ ПРЕДМЕТОВ')}<h2>Хорошо рядом.</h2></div></div><div class="object-grid">${products().filter(v=>v.id!==p.id).map(card).join('')}</div></div>`)}</main>`}
const total=()=>U.state.cart.reduce((n,v)=>n+v.price*v.qty,0);
function cart(){U.modal('Твоя коллекция',U.state.cart.length?U.state.cart.map((v,i)=>`<div class="cart-item">${img(v.image,v.name)}<div><h3>${h(v.name)}</h3><p>${h(v.variant)}</p><div class="quantity"><button data-act="qty" data-index="${i}" data-step="-1" aria-label="Уменьшить количество">−</button><span>${v.qty}</span><button data-act="qty" data-index="${i}" data-step="1" aria-label="Увеличить количество">+</button></div></div><div><strong style="font-size:12px">${U.money(v.price*v.qty)}</strong><br><button class="remove" data-act="remove" data-index="${i}">Убрать</button></div></div>`).join('')+`<div class="cart-summary"><div class="row between total"><span>Итого</span><span>${U.money(total())}</span></div>${btn('Оформить заказ '+icon('right'),'checkout')}<p style="font-size:11px">Способ доставки выберешь на следующем шаге.</p></div>`:U.empty('Пока пусто. Но это ненадолго.','В коллекции есть вещи, которые ждут именно тебя.','catalog','Посмотреть коллекцию'),'drawer')}
function checkout(){U.modal('Оформление заказа',`<form class="form-grid" data-form="checkout">${field('name','Имя',U.state.profile.name,'text','required autocomplete="name"')}${field('email','Email',U.state.profile.email,'email','required autocomplete="email"')}${field('phone','Телефон','','tel','required')}${select('delivery','Получение','pickup',[['pickup','Самовывоз · бесплатно'],['courier','Доставка · 500 ₽']],'id="checkout-delivery"')}${area('address','Адрес / комментарий','','maxlength="1000"')}<div class="full row between"><span>Итого</span><strong id="checkout-total">${U.money(total())}</strong></div><label class="check-field full"><input type="checkbox" required>Согласен на сохранение данных заказа в этом браузере.</label><button class="btn full" type="submit">Сохранить заказ ${icon('arrow')}</button><p class="full" style="font-size:10px">Оплата на сайте не производится.</p></form>`)}
function account(){return `<main>${top('ЛИЧНЫЙ КАБИНЕТ','Твоё пространство.','Профиль, сохранённые находки и история заказов.')}<div class="wrap account-grid"><form class="account-panel stack" data-form="profile"><h2>Мои данные</h2>${field('name','Имя',U.state.profile.name,'text','required')}${field('email','Email',U.state.profile.email,'email','required')}<button class="btn small" type="submit">Сохранить профиль</button>${link('favorites','Моё избранное '+icon('arrow'),'text-link')}</form><div><h2 class="object-title" style="font-size:34px;margin-bottom:28px">Мои заказы.</h2><div class="account-list">${U.state.orders.map(o=>`<div class="account-record"><div class="row between"><h3>${h(o.name)}</h3><span class="pill">${statuses[o.status]||h(o.status)}</span></div><p class="object-order-items">${h(o.items?.map(v=>v.name+' · '+v.variant+' × '+v.qty).join(', ')||'Заказ OBJECTORY')}</p><div class="row between"><span>${h(o.date)}</span><strong>${U.money(o.total)}</strong></div><p style="font-size:11px;margin-top:10px">${o.delivery==='courier'?'Доставка':'Самовывоз'}</p></div>`).join('')||U.empty('История начинается с первого предмета.','Выбери что-то для себя в нашей коллекции.','catalog','Перейти в коллекцию')}</div></div></div></main>`}
function journal(){let post=U.state.posts.find(v=>v.id===U.path[1]&&v.status==='published');if(U.path[1]&&!post)return notFound();return post?`<main class="screen-enter"><article class="journal-article">${top(h(post.category),h(post.title),h(post.description))}${img(post.image,post.title,'',true)}<div class="prose">${post.body.split('\n\n').map(p=>`<p>${h(p)}</p>`).join('')}${link('catalog','Собрать свою коллекцию '+icon('arrow'),'text-link')}</div></article></main>`:`<main>${top('ЖУРНАЛ','Чуть больше внимания.','Заметки о предметах, пространстве и маленьких повседневных ритуалах.')}<div class="wrap section" style="padding-top:20px">${U.state.posts.filter(v=>v.status==='published').map(p=>`<article class="object-journal" style="margin-bottom:60px"><a class="media-frame" href="#/journal/${p.id}">${img(p.image,p.title)}</a><div>${eyebrow(h(p.category))}<h3>${h(p.title)}</h3><p>${h(p.description)}</p>${link('journal/'+p.id,'Читать '+icon('arrow'),'text-link')}</div></article>`).join('')}</div></main>`}
function about(){return `<main>${top('НАШ ПОДХОД','Меньше случайного.<br>Больше своего.','OBJECTORY — небольшая коллекция света, керамики и графики для пространства, в котором хочется жить.')}<div class="wrap">${img('editorial','Предметы OBJECTORY в солнечном свете','',true)}<div class="prose"><h2 class="object-title">Мы начинаем с ощущения.</h2><p>Как предмет лежит в руке. Как свет скользит по поверхности. Как знакомая комната меняется из-за одного нового оттенка.</p><p>Нас интересуют вещи с ясной формой и выразительным материалом. Они могут быть тихими или заметными, но всегда оставляют пространство для твоей собственной истории.</p>${link('catalog','Посмотреть коллекцию '+icon('arrow'),'btn')}</div></div></main>`}
function delivery(){return `<main>${top('ДОСТАВКА И ВОЗВРАТ','Позаботимся о деталях.')}<div class="wrap prose"><h2>Получение заказа</h2><p>В корзине можно выбрать самовывоз или доставку. Стоимость доставки в демонстрационном расчёте — 500 ₽. Итоговая сумма показывается до сохранения заказа.</p><h2>Что происходит после оформления</h2><p>Заказ появляется в личном кабинете и панели управления. Состав, стоимость и контакты сохраняются в этом браузере. Оплата и реальная доставка в этом портфолио не выполняются.</p><h2>Вопрос о предмете</h2><p>Если хочешь уточнить размер, материал или уход, оставь сообщение через форму. Оно сохранится в разделе обращений.</p>${link('contact','Задать вопрос '+icon('arrow'),'btn')}</div></main>`}
function contact(){return `<main>${top('КОНТАКТЫ','Поговорим о вещах.','Размер, материал, сочетание или другая идея — оставь свой вопрос.')}<div class="wrap account-grid"><div><h2 class="object-title" style="font-size:32px">Мы рядом<br>с твоим выбором.</h2><p style="font-size:12px;line-height:1.9;margin-top:25px">Укажи, о каком предмете хочешь узнать больше. Обращение сохранится в списке заявок магазина.</p></div><form class="form-grid" data-form="contact">${field('name','Имя','','text','required')}${field('email','Email','','email','required')}${select('topic','Тема','О предмете',['О предмете','Заказ и доставка','Сотрудничество','Другой вопрос'])}${field('order','Номер заказа, если есть')}${area('message','Твой вопрос','','required maxlength="3000"')}<button class="btn full" type="submit">Сохранить обращение ${icon('arrow')}</button></form></div></main>`}
function notFound(){return `<main class="wrap section">${U.empty('Этого предмета здесь нет.','Он мог быть снят с публикации. Посмотри остальную коллекцию.','catalog','К коллекции')}</main>`}
U.action('favorite',el=>{let id=el.dataset.id,index=U.state.favorites.indexOf(id);if(index<0)U.state.favorites.push(id);else U.state.favorites.splice(index,1);U.save();U.refresh();U.toast(index<0?'Предмет сохранён в избранном':'Предмет убран из избранного')});
U.action('gallery',el=>{gallery=Number(el.dataset.index);U.refresh()});U.action('zoom',el=>{let p=product(el.dataset.id);if(p)U.modal(p.name,img(gallery===1?'editorial':p.image,p.name),'lightbox')});U.action('cart',cart);U.action('checkout',checkout);
U.action('add-cart',el=>{let p=product(el.dataset.id),count=U.state.cart.filter(v=>v.productId===p.id).reduce((n,v)=>n+v.qty,0);if(count>=p.stock){U.toast('Больше нет в наличии');return}let found=U.state.cart.find(v=>v.productId===p.id&&v.variant===variant);if(found)found.qty++;else U.state.cart.push({productId:p.id,name:p.name,image:p.image,variant,price:price(p,variant),qty:1});U.save();U.refresh();U.toast('Предмет добавлен в корзину')});
U.action('qty',el=>{let i=Number(el.dataset.index),v=U.state.cart[i];if(!v)return;let p=product(v.productId),count=U.state.cart.filter(x=>x.productId===v.productId).reduce((n,x)=>n+x.qty,0);if(Number(el.dataset.step)>0&&(!p||count>=p.stock)){U.toast('Больше нет в наличии');return}v.qty+=Number(el.dataset.step);if(v.qty<=0)U.state.cart.splice(i,1);U.save();U.refresh();cart()});U.action('remove',el=>{U.state.cart.splice(Number(el.dataset.index),1);U.save();U.refresh();cart()});
U.form('search',data=>{query=String(data.get('query'));U.refresh()});U.form('profile',data=>{U.state.profile=Object.fromEntries(data);U.save();U.toast('Данные сохранены')});U.form('newsletter',(data,form)=>{let email=String(data.get('email'));if(!U.state.subscribers.includes(email))U.state.subscribers.push(email);U.save();form.reset();U.toast('Адрес сохранён в списке подписчиков')});
U.form('checkout',data=>{if(!U.state.cart.length)return;for(let item of U.state.cart){let p=product(item.productId),qty=U.state.cart.filter(v=>v.productId===item.productId).reduce((n,v)=>n+v.qty,0);if(!p||p.stock<qty){U.toast('Часть предметов недоступна. Обнови корзину.');return}}let values=Object.fromEntries(data),shipping=values.delivery==='courier'?500:0;let order={id:U.id('order'),name:'OB-'+String(Date.now()).slice(-6),customer:values.name,email:values.email,phone:values.phone,address:values.address,delivery:values.delivery,total:total()+shipping,items:structuredClone(U.state.cart),date:U.today(),status:'new'};U.state.orders.unshift(order);for(let item of U.state.cart)product(item.productId).stock-=item.qty;U.state.profile={name:values.name,email:values.email};U.state.cart=[];U.log('Создан заказ '+order.name);U.refresh();U.modal('Заказ сохранён',U.success(order.name,'Предметы добавлены в твой заказ. Его статус доступен в личном кабинете. Оплата не производилась.','account','Открыть личный кабинет'))});
U.form('contact',data=>{let values=Object.fromEntries(data);U.state.requests.unshift({id:U.id('request'),...values,status:'new',date:U.today()});U.log('Новое обращение: '+values.topic);U.modal('Обращение сохранено',U.success('Спасибо за вопрос.','Сообщение добавлено в список обращений магазина.','catalog','Вернуться к коллекции'))});
document.addEventListener('change',e=>{if(e.target.id==='catalog-sort'){sort=e.target.value;U.refresh()}if(e.target.id==='product-variant'){variant=e.target.value;U.refresh()}if(e.target.id==='checkout-delivery'){document.querySelector('#checkout-total').textContent=U.money(total()+(e.target.value==='courier'?500:0));document.querySelector('[name=address]').required=e.target.value==='courier'}});
